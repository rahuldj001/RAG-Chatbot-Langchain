[project]
name = "rag-chatbot"
version = "0.2.0"
description = "Conversational RAG Chatbot powered by LangChain"
authors = [{ name = "Võ Đình Đạt", email = "vodinhdat03@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "gradio>=4.44.0,<5",
    "python-dotenv>=1.0.1,<2",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-huggingface>=0.0.3",
    "transformers>=4.39.1,<5",
    "torch",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.3,<2",
    "tqdm>=4.66.4,<5",
    "requests>=2.32.3,<3",
    "pandas>=2.2.3,<3",
    "sentence-transformers>=3.2.0,<4",
    "pydantic>=2.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9,<0.7",
    "deptry>=0.20.0,<0.21",
    "pytest>=8.3.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry.per_rule_ignores]
DEP002 = ["sentence-transformers"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".venv",
]
